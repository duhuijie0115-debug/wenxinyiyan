[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp -ac
user=app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
user=app
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:workbuddy]
command=/usr/bin/dbus-run-session -- /opt/WorkBuddy/workbuddy --no-sandbox --disable-gpu
user=app
directory=/home/app
environment=BROWSER="chromium --no-sandbox"
priority=30
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/home/app/workbuddy-console.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/app/workbuddy-errors.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:desktop]
command=/usr/bin/x11vnc -display :99 -localhost -forever -shared -nopw -rfbport 5900
user=app
priority=40
autorestart=true
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc-errors.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
user=app
priority=50
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc-errors.log

[program:api]
command=/opt/venv/bin/python /app/optimizer_service.py
user=app
directory=/app
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
